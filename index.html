<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Mossheart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <!-- Anmeldung -->
  <div id="auth-screen" class="auth-screen">
    <main class="auth-content">
      <h1 class="logo">Mossheart</h1>
      <p class="tagline">Ein Dorf im Herzen des Waldes</p>
      <section id="auth-view" class="px-frame">
        <div class="tabs">
          <button type="button" id="tab-login" class="px-btn active">Anmelden</button>
          <button type="button" id="tab-register" class="px-btn">Registrieren</button>
        </div>
        <form id="auth-form">
          <label id="name-label" hidden>Charaktername
            <input id="character" minlength="3" maxlength="24" autocomplete="nickname">
          </label>
          <label>E-Mail <input id="email" type="email" required autocomplete="email"></label>
          <label>Passwort (mind. 8 Zeichen) <input id="password" type="password" minlength="8" required autocomplete="current-password"></label>
          <button type="submit" id="submit-btn" class="px-btn primary">Anmelden</button>
          <p id="auth-msg" class="msg" role="status"></p>
        </form>
      </section>
    </main>
  </div>

  <!-- Spiel -->
  <div id="game" hidden>
    <div id="stage" class="stage"></div>

    <header class="ui topbar">
      <div class="chip px-frame small" id="mood-chip">…</div>
      <div class="banner"><span id="banner-title">Dorf</span></div>
      <div class="top-right">
        <button type="button" class="px-btn icon" id="gear-btn" aria-label="Einstellungen">⚙</button>
        <div class="px-frame small menu" id="gear-menu" hidden>
          <p class="muted" id="who"></p>
          <button type="button" class="px-btn" id="logout-btn">Abmelden</button>
        </div>
      </div>
    </header>

    <section class="ui panel px-frame" id="panel" hidden>
      <div class="panel-head"><h2 id="panel-title"></h2><button type="button" class="px-btn icon" id="panel-close" aria-label="Schließen">✕</button></div>
      <div id="panel-body"></div>
    </section>

    <nav class="ui dock px-frame" id="dock" aria-label="Hauptmenü"></nav>
    <div class="ui tooltip px-frame small" id="tooltip" hidden></div>
  </div>

  <script type="module" src="app.js?v=9"></script>
</body>
</html>
